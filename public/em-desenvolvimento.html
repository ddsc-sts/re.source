
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em desenvolvimento | re.source</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #24352c;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 40px 28px;
            text-align: center;
            background: #fff;
            border: 1px solid #e0e9e3;
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 28px;
        }

        p {
            color: #64746a;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 22px;
            border-radius: 10px;
            background: #167348;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #105b38;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">🛠️</div>

        <h1>Estamos trabalhando nisso!</h1>

        <p>
            Esta funcionalidade do re.source está em desenvolvimento.
            Em breve, ela estará disponível.
        </p>

        <a href="/re.source/base">Voltar à página inicial</a>
    </main>
</body>
</html>
