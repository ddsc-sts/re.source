<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificar E-mail — Re.Source</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/RE.SOURCE/FrontEnd/css/pendente.css" />
</head>
<body>

  <div class="pendente-card">

    <!-- Logo -->
    <a href="/" class="logo-wrap">
      <span class="logo-text">Re.<strong>Source</strong></span>
    </a>

    <!-- Icone envelope animado -->
    <div class="envelope-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
        <rect x="4" y="14" width="56" height="38" rx="6" fill="var(--green)" opacity=".12"/>
        <rect x="4" y="14" width="56" height="38" rx="6" stroke="var(--green)" stroke-width="2.5"/>
        <polyline points="4,14 32,36 60,14" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <span class="ping"></span>
    </div>

    <h1 class="pendente-title">Confirme seu e-mail</h1>
    <p class="pendente-sub">
      Enviamos um código de 6 dígitos para<br>
      <strong id="emailDisplay">carregando...</strong>
    </p>

    <!-- Alerta -->
    <div class="alert-box alert-danger" id="alertBox" role="alert" hidden></div>

    <!-- Form -->
    <form id="formCodigo" method="POST" novalidate>
      <div class="code-inputs">
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digito 1" />
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digito 2" />
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digito 3" />
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digito 4" />
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digito 5" />
        <input type="text" inputmode="numeric" maxlength="1" class="code-digit" autocomplete="off" aria-label="Digito 6" />
      </div>
      <input type="hidden" name="codigo" id="codigoHidden" />

      <button type="submit" class="btn-verificar" id="btnVerificar" disabled>
        <span class="btn-label">Verificar código</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </form>

    <!-- Reenviar -->
    <div class="reenviar-wrap">
      <span class="reenviar-text">Não recebeu?</span>
      <button type="button" class="btn-link" id="btnReenviar" disabled>Reenviar código</button>
      <span class="reenviar-countdown" id="countdown"></span>
    </div>

    <a href="/RE.SOURCE/cadastro.php" class="link-voltar">← Voltar ao cadastro</a>

  </div>

  <script>
    (() => {
      'use strict';

      const base     = window.location.pathname.replace(/pendente\.php.*$/, '');
      const alertBox = document.getElementById('alertBox');
      const digits   = Array.from(document.querySelectorAll('.code-digit'));
      const hidden   = document.getElementById('codigoHidden');
      const btnVer   = document.getElementById('btnVerificar');
      const form     = document.getElementById('formCodigo');
      const spinner  = document.querySelector('.btn-spinner');
      const label    = document.querySelector('.btn-label');
      const btnRenv  = document.getElementById('btnReenviar');
      const countEl  = document.getElementById('countdown');

      let email = '';
      let timer = null;

      /* -- Busca e-mail da sessão -- */
      fetch(base + 'BackEnd/auth/sessao-info.php')
        .then(r => r.json())
        .then(data => {
          if (!data.ok) {
            location.href = base + 'cadastro.php';
            return;
          }
          email = data.email;
          document.getElementById('emailDisplay').textContent = email;
        })
        .catch(() => {
          document.getElementById('emailDisplay').textContent = '(erro ao carregar e-mail)';
        });

      /* -- Inputs de código -- */
      function syncHidden() {
        const val = digits.map(d => d.value).join('');
        hidden.value    = val;
        btnVer.disabled = val.length < 6;
      }

      digits.forEach((el, i) => {
        el.addEventListener('input', () => {
          el.value = el.value.replace(/\D/g, '').slice(-1);
          syncHidden();
          if (el.value && i < digits.length - 1) digits[i + 1].focus();
          digits.forEach(x => x.classList.remove('digit-error'));
        });

        el.addEventListener('keydown', e => {
          if (e.key === 'Backspace'  && !el.value && i > 0)              digits[i - 1].focus();
          if (e.key === 'ArrowLeft'  && i > 0)                           digits[i - 1].focus();
          if (e.key === 'ArrowRight' && i < digits.length - 1)           digits[i + 1].focus();
        });

        el.addEventListener('paste', e => {
          e.preventDefault();
          const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
          txt.split('').slice(0, 6).forEach((ch, j) => { if (digits[j]) digits[j].value = ch; });
          syncHidden();
          digits[Math.min(txt.length, 5)].focus();
        });
      });

      digits[0].focus();

      /* -- Submit -- */
      form.addEventListener('submit', async e => {
        e.preventDefault();

        // Garante que o hidden está atualizado antes de enviar
        syncHidden();

        const codigo = hidden.value;
        if (codigo.length < 6) {
          alertBox.className   = 'alert-box alert-danger';
          alertBox.textContent = 'Digite os 6 dígitos do código.';
          alertBox.hidden      = false;
          return;
        }

        alertBox.hidden = true;
        label.hidden    = true;
        spinner.hidden  = false;
        btnVer.disabled = true;

        try {
          // Envia como FormData com o código explícito
          const fd = new FormData();
          fd.append('codigo', codigo);

          const res  = await fetch(base + 'BackEnd/auth/verificar.php', {
            method:  'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body:    fd,
          });

          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch {
            alertBox.className   = 'alert-box alert-danger';
            alertBox.textContent = 'Resposta inesperada do servidor.';
            alertBox.hidden      = false;
            return;
          }

          if (data.ok) {
            location.href = data.redirect;
          } else {
            alertBox.className   = 'alert-box alert-danger';
            alertBox.textContent = data.erro;
            alertBox.hidden      = false;
            digits.forEach(d => { d.value = ''; d.classList.add('digit-error'); });
            hidden.value = '';
            btnVer.disabled = true;
            digits[0].focus();
          }
        } catch {
          alertBox.className   = 'alert-box alert-danger';
          alertBox.textContent = 'Falha na comunicação com o servidor.';
          alertBox.hidden      = false;
        } finally {
          label.hidden    = false;
          spinner.hidden  = true;
          if (btnVer.disabled && hidden.value.length === 6) btnVer.disabled = false;
        }
      });

      /* -- Countdown reenviar -- */
      function startCountdown(s = 60) {
        btnRenv.disabled = true;
        let left = s;
        function tick() {
          countEl.textContent = `(${left}s)`;
          if (left <= 0) { clearInterval(timer); countEl.textContent = ''; btnRenv.disabled = false; return; }
          left--;
        }
        tick();
        timer = setInterval(tick, 1000);
      }

      startCountdown(60);

      /* -- Reenviar -- */
      btnRenv.addEventListener('click', async () => {
        btnRenv.disabled = true;
        alertBox.hidden  = true;

        try {
          const fd = new FormData();
          fd.append('email', email);
          const res  = await fetch(base + 'BackEnd/auth/reenviar.php', {
            method:  'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            body:    fd,
          });
          const data = await res.json();

          alertBox.className   = 'alert-box ' + (data.ok ? 'alert-success' : 'alert-danger');
          alertBox.textContent = data.ok ? 'Novo código enviado! Verifique seu e-mail.' : data.erro;
          alertBox.hidden      = false;
          if (data.ok) startCountdown(60);
          else btnRenv.disabled = false;
        } catch {
          alertBox.className   = 'alert-box alert-danger';
          alertBox.textContent = 'Falha ao reenviar. Tente novamente.';
          alertBox.hidden      = false;
          btnRenv.disabled     = false;
        }
      });

    })();
  </script>
</body>
</html>
