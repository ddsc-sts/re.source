
services:
  app:
    build: .
    container_name: resource_app
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080/re.source
      APP_BASE_PATH: /re.source
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: resource
      DB_USERNAME: resource_user
      DB_PASSWORD: resource_dev_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: resource_db
    environment:
      MARIADB_DATABASE: resource
      MARIADB_USER: resource_user
      MARIADB_PASSWORD: resource_dev_password
      MARIADB_ROOT_PASSWORD: root_dev_password
    volumes:
      - resource_db_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  resource_db_data:
