services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_BASE_PATH: ""
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: resource
      DB_USERNAME: resource
      DB_PASSWORD: resource
    volumes:
      - uploads:/var/www/html/uploads
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: resource
      MARIADB_USER: resource
      MARIADB_PASSWORD: resource
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - database:/var/lib/mysql
      - ./database/seeders/re.sourcebanco.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/inserts/create_admin.sql:/docker-entrypoint-initdb.d/002-admin.sql:ro
      - ./database/inserts/empresa_demo.sql:/docker-entrypoint-initdb.d/003-demo-companies.sql:ro
      - ./database/inserts/produto.sql:/docker-entrypoint-initdb.d/004-demo-listings.sql:ro
      - ./database/inserts/saldo_demo.sql:/docker-entrypoint-initdb.d/005-demo-balance.sql:ro
      - ./database/migrations/001_product_innovation.sql:/docker-entrypoint-initdb.d/006-product-innovation.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  phpmyadmin:
    image: phpmyadmin:5-apache
    profiles: ["tools"]
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
    depends_on:
      database:
        condition: service_healthy

volumes:
  database:
  uploads:
